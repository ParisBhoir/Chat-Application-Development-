server:
  port: 8084

spring:
  application:
    name: api-gateway

  cloud:
    loadbalancer:
      sticky-session:
        enabled: true
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      httpclient:
        websocket:
          max-frame-payload-length: 65536

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

      routes:
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**, /api/auth/**

#        - id: chat-service
#          uri: lb://CHAT-SERVICE
#          predicates:
#            - Path=/api/chat/**

        - id: chat-ws
          uri: lb:ws://CHAT-SERVICE
          predicates:
              - Path=/ws/chat
#          filters:
#            - PreserveHostHeader
#          filters:
#            - RemoveRequestHeader=Sec-WebSocket-Protocol

eureka:
  client:
    service-url:
      defaultZone: http://eureka-service:8761/eureka/

logging:
  level:
    org.springframework.cloud.gateway: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"
  endpoint:
    health:
      show-details: always
